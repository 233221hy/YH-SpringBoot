version: "3.9"

services:
  # ── Redis 缓存 ──────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: yh-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ── RabbitMQ 消息队列 ─────────────────────────
  rabbitmq:
    image: rabbitmq:3.12-management-alpine
    container_name: yh-rabbitmq
    restart: always
    ports:
      - "5672:5672"     # AMQP 协议端口
      - "15672:15672"   # Management UI 端口
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Spring Boot 应用 ───────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: yh-app
    restart: always
    ports:
      - "2867:2867"
    depends_on:
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      # Redis（指向容器内的 redis 服务）
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: "6379"
      # JVM 堆内存（可按宿主机内存调整）
      JAVA_OPTS: "-Xms512m -Xmx1024m -XX:+UseG1GC -Dfile.encoding=UTF-8"

volumes:
  redis-data:
  rabbitmq-data:
